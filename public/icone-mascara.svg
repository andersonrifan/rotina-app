<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Rotina (maskable)</title>
  <!-- Versão "maskable" para Android: o sistema recorta o ícone na forma que
       o aparelho usa (círculo, squircle, gota). Duas exigências:
       1. o fundo sangra até a borda, sem cantos arredondados próprios;
       2. o desenho fica dentro da zona segura — os 80% centrais, ou seja
          margem de 51 px em cada lado neste canvas de 512.
       Aqui o conteúdo foi reduzido a ~62% para folgar em qualquer recorte. -->
  <rect width="512" height="512" fill="#f5ead8"/>
  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <rect x="140" y="96"  width="232" height="70"  rx="26" fill="#8c491a"/>
    <rect x="140" y="182" width="232" height="52"  rx="22" fill="#c67139"/>
    <rect x="140" y="250" width="232" height="94"  rx="30" fill="#56633f"/>
    <rect x="140" y="360" width="232" height="56"  rx="24" fill="#c0b6a5"/>
    <rect x="104" y="96"  width="18"  height="320" rx="9"  fill="#a4501f"/>
  </g>
</svg>
