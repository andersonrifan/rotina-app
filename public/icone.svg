<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Rotina</title>
  <!-- Fundo: o creme do app, com o canto arredondado que o Android espera -->
  <rect width="512" height="512" rx="114" fill="#f5ead8"/>

  <!-- A coluna do dia: quatro blocos empilhados, na proporção em que aparecem
       no calendário. É a única imagem do app que se lê a 48 px. -->
  <g>
    <rect x="140" y="96"  width="232" height="70"  rx="26" fill="#8c491a"/>
    <rect x="140" y="182" width="232" height="52"  rx="22" fill="#c67139"/>
    <rect x="140" y="250" width="232" height="94"  rx="30" fill="#56633f"/>
    <rect x="140" y="360" width="232" height="56"  rx="24" fill="#c0b6a5"/>
  </g>

  <!-- A barra lateral de categoria, o traço que identifica o app -->
  <rect x="104" y="96" width="18" height="320" rx="9" fill="#a4501f"/>
</svg>
